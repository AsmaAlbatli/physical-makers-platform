<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="شعار صناع الحركة">
  <defs>
    <linearGradient id="brandGradient" x1="10" y1="8" x2="88" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#19e3ff"/>
      <stop offset=".46" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#ff4d9d"/>
    </linearGradient>
    <linearGradient id="starGradient" x1="34" y1="24" x2="70" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff3b0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
