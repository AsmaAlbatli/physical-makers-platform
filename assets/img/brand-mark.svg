  <circle cx="75" cy="24" r="3.2" fill="#ffffff" opacity=".9"/>
  <circle cx="78" cy="67" r="2.4" fill="#ffffff" opacity=".65"/>
  <circle cx="25" cy="73" r="2.1" fill="#ffffff" opacity=".55"/>
